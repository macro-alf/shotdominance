[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shotdominance"
version = "3.0.0"
description = "In-play shot-dominance football monitor (alerts only, never places bets)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["shotdominance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
